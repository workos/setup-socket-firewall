name: Setup Socket Firewall
description: >-
  Route npm installs through the WorkOS Socket Firewall registry and
  null-route registry.npmjs.org so installs cannot silently fall back to
  the public registry.
inputs:
  token:
    description: >-
      Socket Firewall auth token. Pass secrets.SOCKET_FIREWALL_TOKEN.
      When empty (e.g. fork PRs on public repos, where secrets are
      unavailable), the action emits a warning and leaves the public
      registry reachable.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Configure npm registry and null-route public registry
      shell: bash
      env:
        SFW_TOKEN: ${{ inputs.token }}
      run: |
        if [ -z "$SFW_TOKEN" ]; then
          echo "::warning title=Socket Firewall not active::SOCKET_FIREWALL_TOKEN not provided — npm installs will use the public registry. See workos/setup-socket-firewall README."
          exit 0
        fi

        # Registry + host-scoped auth token, written with restrictive
        # permissions since the file contains a credential.
        umask 077
        {
          echo "registry=https://socket-firewall.workos.dev/"
          echo "//socket-firewall.workos.dev/:_authToken=${SFW_TOKEN}"
          # Rewrite ALL lockfile `resolved` hosts to the firewall registry,
          # not just registry.npmjs.org (npm's default `replace-registry-host`
          # is `npmjs`, which leaves resolved URLs on other hosts — e.g.
          # registry.yarnpkg.com — fetched verbatim, bypassing scanning).
          echo "replace-registry-host=always"
        } >> ~/.npmrc
        chmod 600 ~/.npmrc

        # Null-route the public registry and known public mirrors (IPv4 + IPv6)
        # so any install that bypasses the npmrc fails loudly instead of
        # silently reaching a public registry. Same pattern as the
        # workos/workos init action (INFRA-5509).
        for host in registry.npmjs.org registry.yarnpkg.com; do
          printf '127.0.0.1 %s\n::1 %s\n' "$host" "$host" | sudo tee -a /etc/hosts >/dev/null
        done

        echo "Socket Firewall active: npm registry -> https://socket-firewall.workos.dev/ (replace-registry-host=always); registry.npmjs.org and registry.yarnpkg.com null-routed."
