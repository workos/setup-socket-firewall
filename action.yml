name: Setup Socket Firewall
description: >-
  Route public npm-compatible dependency downloads through the WorkOS Socket
  Firewall and DNS-null-route known public JavaScript registries.
inputs:
  token:
    description: >-
      Socket Firewall auth token. Pass secrets.SOCKET_FIREWALL_TOKEN directly
      to this action; do not expose it at workflow or job scope.
    required: false
    default: ""
  allow-external-fork-fallback:
    description: >-
      Permit public-registry fallback only for an external pull request against
      a public repository. The action independently validates the event context.
    required: false
    default: "false"
  configure-bun:
    description: >-
      Configure Bun's user-level registry token file. Enable only for Bun
      dependency-install jobs.
    required: false
    default: "false"
outputs:
  active:
    description: Whether Socket Firewall protection is active.
    value: ${{ steps.configure.outputs.active }}
runs:
  using: composite
  steps:
    - name: Configure Socket Firewall
      id: configure
      shell: bash
      env:
        SFW_TOKEN: ${{ inputs.token }}
        SFW_ALLOW_EXTERNAL_FORK_FALLBACK: ${{ inputs.allow-external-fork-fallback }}
        SFW_CONFIGURE_BUN: ${{ inputs.configure-bun }}
        SFW_EVENT_NAME: ${{ github.event_name }}
        SFW_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        SFW_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        SFW_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
        # Test-only override is cleared for real action consumers.
        SFW_HOSTS_FILE: ""
      run: bash "$GITHUB_ACTION_PATH/scripts/configure.sh"
