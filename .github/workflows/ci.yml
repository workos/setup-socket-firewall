name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-secret:
    name: Check secret availability
    runs-on: ubuntu-22.04
    outputs:
      has-token: ${{ steps.probe.outputs.has-token }}
    steps:
      - name: Probe SOCKET_FIREWALL_TOKEN
        id: probe
        run: echo "has-token=${{ secrets.SOCKET_FIREWALL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  smoke-with-token:
    name: Smoke test (with-token)
    needs: check-secret
    if: needs.check-secret.outputs.has-token == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Run action (real token)
        uses: ./
        with:
          token: ${{ secrets.SOCKET_FIREWALL_TOKEN }}

      - name: Assert null-route and npmrc
        run: |
          set -euo pipefail
          grep -q "registry=https://socket-firewall.workos.dev/" ~/.npmrc
          grep -q "replace-registry-host=always" ~/.npmrc
          for host in registry.npmjs.org registry.yarnpkg.com; do
            grep -q "127.0.0.1 $host" /etc/hosts
            grep -q "::1 $host" /etc/hosts
            # Public registry/mirror must be unreachable
            if curl -sS --max-time 5 "https://$host/" -o /dev/null; then
              echo "::error::$host is still reachable"; exit 1
            fi
          done
          echo "null-route verified"

      - name: Install through the firewall
        run: |
          set -euo pipefail
          mkdir /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null
          npm install left-pad --no-audit --no-fund
          node -e "require('left-pad'); console.log('install through SFW OK')"

      - name: Assert lockfile resolved-host is redirected through the firewall
        run: |
          set -euo pipefail
          # Regression guard for the bypass this action closes: a lockfile whose
          # `resolved` host is a public mirror (registry.yarnpkg.com) must NOT be
          # fetched verbatim. registry.yarnpkg.com is null-routed, so a successful
          # `npm ci` proves replace-registry-host=always redirected the tarball
          # fetch to socket-firewall.workos.dev. The tarball content (and thus the
          # integrity hash) is identical to registry.npmjs.org, which the firewall
          # proxies.
          mkdir /tmp/redirect && cd /tmp/redirect
          cat > package.json <<'JSON'
          { "name": "sfw-redirect-smoke", "version": "1.0.0", "dependencies": { "left-pad": "1.3.0" } }
          JSON
          cat > package-lock.json <<'JSON'
          {
            "name": "sfw-redirect-smoke",
            "version": "1.0.0",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {
              "": { "name": "sfw-redirect-smoke", "version": "1.0.0", "dependencies": { "left-pad": "1.3.0" } },
              "node_modules/left-pad": {
                "version": "1.3.0",
                "resolved": "https://registry.yarnpkg.com/left-pad/-/left-pad-1.3.0.tgz",
                "integrity": "sha512-XI5MPzVNApjAyhQzphX8BkmKsKUxD4LdyK24iZeQGinBN9yTQT3bFlCBy/aVx2HrNcqQGsdot8ghrjyrvMCoEA=="
              }
            }
          }
          JSON
          npm ci --no-audit --no-fund
          node -e "require('left-pad'); console.log('yarnpkg-resolved lockfile redirected through SFW OK')"

  smoke-without-token:
    name: Smoke test (without-token)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Run action (no token)
        uses: ./
        with:
          token: ""

      - name: Assert untouched
        run: |
          set -euo pipefail
          if grep -q "socket-firewall" ~/.npmrc 2>/dev/null; then
            echo "::error::npmrc modified despite empty token"; exit 1
          fi
          if grep -q "registry.npmjs.org" /etc/hosts; then
            echo "::error::/etc/hosts modified despite empty token"; exit 1
          fi
          curl -sS --max-time 10 https://registry.npmjs.org/ -o /dev/null
          echo "fallback path verified (public registry reachable, warning emitted)"
